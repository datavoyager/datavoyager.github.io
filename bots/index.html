<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Copilot Studio – No iframe embed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <!--
    Page content can be completely empty.
    Everything below is injected by JavaScript.
  -->

  <script>
    (function () {
      // =============================
      // CONFIG – UPDATE THIS
      // =============================
      const CONFIG = {
        tokenEndpoint: "TOKEN_ENDPOINT_URL_HERE", // must return { token: "..." }
        title: "Copilot",
        width: 360,
        height: 520,
        position: "bottom-right" // bottom-right | bottom-left
      };

      // =============================
      // Helpers
      // =============================
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }

      function injectStyle(css) {
        const style = document.createElement("style");
        style.textContent = css;
        document.head.appendChild(style);
      }

      function injectShell() {
        const host = document.createElement("div");
        host.id = "copilot-root";
        document.body.appendChild(host);

        host.innerHTML = `
          <div class="cp-widget ${CONFIG.position}">
            <button class="cp-fab" aria-label="Open chat">💬</button>

            <section class="cp-panel" hidden>
              <header class="cp-header">
                <span class="cp-title">${CONFIG.title}</span>
                <button class="cp-close" aria-label="Close">✕</button>
              </header>
              <div class="cp-webchat"></div>
            </section>
          </div>
        `;

        return host;
      }

      async function getToken() {
        const res = await fetch(CONFIG.tokenEndpoint, {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        if (!res.ok) {
          throw new Error("Token endpoint error: " + res.status);
        }

        const data = await res.json();
        if (!data || !data.token) {
          throw new Error("Token endpoint did not return { token }");
        }

        return data.token;
      }

      // =============================
      // Init
      // =============================
      async function init() {
        injectStyle(`
          .cp-widget {
            position: fixed;
            z-index: 99999;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
          }
          .cp-widget.bottom-right { right: 18px; bottom: 18px; }
          .cp-widget.bottom-left { left: 18px; bottom: 18px; }

          .cp-fab {
            width: 56px;
            height: 56px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            background: #2563eb;
            color: #fff;
            font-size: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,.25);
          }

          .cp-panel {
            width: ${CONFIG.width}px;
            height: ${CONFIG.height}px;
            margin-bottom: 12px;
            border-radius: 14px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 14px 45px rgba(0,0,0,.3);
            display: flex;
            flex-direction: column;
          }

          .cp-header {
            height: 48px;
            background: #0f172a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
          }

          .cp-title {
            font-size: 14px;
            font-weight: 600;
          }

          .cp-close {
            border: none;
            background: transparent;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            width: 36px;
