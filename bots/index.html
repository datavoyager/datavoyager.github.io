<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Copilot Studio – No iframe, Connection String</title>

  <!-- Web Chat UI -->
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>

  <!-- Agents SDK -->
  <script type="importmap">
    {
      "imports": {
        "@microsoft/agents-copilotstudio-client":
          "https://cdn.jsdelivr.net/npm/@microsoft/agents-copilotstudio-client/+esm"
      }
    }
  </script>
</head>

<body>
  <div id="webchat" style="width:360px;height:540px;"></div>

  <script type="module">
    import {
      CopilotStudioClient,
      CopilotStudioWebChat
    } from "@microsoft/agents-copilotstudio-client";

    /*********************************************************
     * 1) Paste the connection string from Native app channel
     *********************************************************/
    const CONNECTION_STRING =
      "https://defaultbbcab52e9fbe43d6a2f39f66c43df2.68.environment.api.powerplatform.com/copilotstudio/dataverse-backed/authenticated/bots/copilots_header_0c5b0/conversations?api-version=2022-03-01-preview";

    /*********************************************************
     * 2) Create the Copilot Studio client
     *********************************************************/
    const client = new CopilotStudioClient(
      { connectionString: CONNECTION_STRING }
    );

    /*********************************************************
     * 3) Create a WebChat-compatible connection (NO iframe)
     *********************************************************/
    const directLine = CopilotStudioWebChat.createConnection(client, {
      showTyping: true
    });

    /*********************************************************
     * 4) Render Web Chat into a DIV
     *********************************************************/
    window.WebChat.renderWebChat(
      {
        directLine,
        styleOptions: {
          accent: "#4f46e5",
          bubbleBorderRadius: 12,
          bubbleFromUserBorderRadius: 12
        }
      },
      document.getElementById("webchat")
    );
  </script>
</body>
</html>
